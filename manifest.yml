display_information:
  name: Word Limit Checker
  description: Counts the words in a draft and checks them against a limit.
features:
  bot_user:
    display_name: Word Limit Checker
    always_online: false
  slash_commands:
    - command: /wordcount
      url: https://slack-wordcount.zahid23saim.workers.dev
      description: Count the words in a draft and check it against a limit
      usage_hint: "[limit] your text"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
